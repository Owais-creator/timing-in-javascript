<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stylish Live Clock</title>
  <style>
    
    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(120deg, #1e3c72, #2a5298);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

  
    .clock-box {
      background: rgba(0, 0, 0, 0.25);
      padding: 40px 60px;
      border-radius: 25px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      display: inline-block;
      animation: pulse 2s infinite;
    }

   
    h1 {
      font-size: 2.8em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
    }

    
    .clock-box p {
      font-size: 2em;
      margin: 8px 0;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 20px rgba(0,0,0,0.3);}
      50% { box-shadow: 0 0 35px rgba(0,0,0,0.6);}
      100% { box-shadow: 0 0 20px rgba(0,0,0,0.3);}
    }
  </style>
</head>
<body>

  <div class="clock-box">
    <h1>Live Clock</h1>
    <p id="day"></p>
    <p id="date"></p>
    <p id="time"></p>
  </div>

  <script>
    function updateClock() {
      let now = new Date();

     
      let dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      let day = dayNames[now.getDay()];
      document.getElementById("day").innerText = day;

     
      let date = now.getDate();
      let monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      let month = monthNames[now.getMonth()];
      let year = now.getFullYear();
      document.getElementById("date").innerText = `${date} ${month} ${year}`;

     
      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();
      let ampm = hours >= 12 ? "PM" : "AM";

      if(hours > 12) hours -= 12;
      if(hours === 0) hours = 12;

     
      minutes = minutes < 10 ? "0" + minutes : minutes;
      seconds = seconds < 10 ? "0" + seconds : seconds;

      document.getElementById("time").innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
    }

    
    updateClock();
    
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
