<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>clock</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #121212;
  font-family: 'Orbitron', sans-serif;
}

.clock-circle {
  width: 360px;
  height: 360px;
  border-radius: 50%;
  background: rgba(30,30,30,0.6);
  border: 4px solid #555;
  box-shadow: 0 0 10px #555;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  animation: jumpIn 1s ease-out;
}

.clock-circle h1 {
  font-size: 2.5em;
  margin: 0;
  color: #ccc;
  text-shadow: 0 0 3px #888;
}

.clock-circle p {
  font-size: 1.8em;
  margin: 5px 0;
  color: #aaa;
  text-shadow: 0 0 2px #666;
}

@keyframes jumpIn {
  0% { transform: translateY(-200px) scale(0.5); opacity: 0; }
  60% { transform: translateY(20px) scale(1.1); opacity: 1; }
  80% { transform: translateY(-10px) scale(0.95); }
  100% { transform: translateY(0) scale(1); }
}
</style>
</head>
<body>

<div class="clock-circle">
  <h1>Live Clock</h1>
  <p id="day"></p>
  <p id="date"></p>
  <p id="time"></p>
</div>

<script>
function updateClock() {
  let now = new Date();


  let dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  document.getElementById("day").innerText = dayNames[now.getDay()];


  let monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let date = now.getDate();
  let month = monthNames[now.getMonth()];
  let year = now.getFullYear();
  document.getElementById("date").innerText = `${date} ${month} ${year}`;

 
  let hours = now.getHours();  
  let minutes = now.getMinutes();
  let seconds = now.getSeconds();
  
  let ampm = hours >= 12 ? "PM" : "AM";

  hours = hours % 12;
  if (hours === 0) hours = 12; 

  hours = hours < 10 ? "0" + hours : hours;
  minutes = minutes < 10 ? "0" + minutes : minutes;
  seconds = seconds < 10 ? "0" + seconds : seconds;

  document.getElementById("time").innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
}


updateClock();

setInterval(updateClock, 1000);
</script>

</body>
</html>
